# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "2.3.0"
  python_check_max: "3.15"

package:
  name: pytest-services
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pytest-services/pytest_services-${{ version }}.tar.gz
  sha256: ee3dd1f71e7a9837b2ad07d919af71d6f642c6b3475ef75fc4c4d80e2e8de20d

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools >=61
    - setuptools-scm >=6.2
  run:
    - psutil
    - pytest
    - python >=${{ python_min }}
    - requests
    - setuptools
    - zc.lockfile >=2.0

tests:
  - package_contents:
      strict: true
      files:
        - etc/conda/test-files/pytest-services/**
      site_packages:
        - pytest_services/**
        - pytest_services-${{ version }}.dist-info/**
  - python:
      imports: pytest_services
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - files:
      source:
        - tests/**
    requirements:
      run:
        - astroid
        - pytest-cov
        - python ${{ python_min }}.*
        - if: unix
          then:
            - mysqlclient
            - pylibmc
    script:
      - if: unix
        then:
          - coverage run --source=pytest_services --branch -m pytest -vv -k "not (xvfb or mysql or memcached)"
          - coverage report --show-missing --skip-covered --fail-under=44

about:
  license: MIT
  license_file: LICENSE.txt
  summary: Collection of fixtures and utility functions to run service processes for your tests
  homepage: https://pypi.org/project/pytest-services
  repository: https://github.com/pytest-dev/pytest-services

extra:
  recipe-maintainers:
    - bollwyvl
